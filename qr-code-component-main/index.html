<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | QR code component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Your small custom stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <main class="container flex-grow-1 d-flex align-items-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4 d-flex justify-content-center">
        <article class="card qr-card w-100 border-0 p-3 pb-4 text-center">
          <img
            class="card-img-top qr-image"
            src="./images/image-qr-code.png"
            alt="QR code to visit Frontend Mentor"
          >

          <div class="card-body px-2 pt-4 pb-0">
            <h1 class="h5 fw-bold mb-3">
              Improve your front-end skills by building projects
            </h1>

            <p class="small text-secondary lh-sm mb-0">
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level.
            </p>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="text-center small py-2">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Prasanthi Kola</a>.
  </footer>
</body>
</html>
